<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Container Security Self-Check</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center;
           justify-content: center; background: #0d1117; color: #e6edf3;
           font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px;
            padding: 2rem; width: min(90vw, 560px); }
    h1 { font-size: 1.3rem; margin: 0 0 1.25rem; }
    h2 { font-size: .8rem; letter-spacing: .08em; text-transform: uppercase;
         color: #8b949e; margin: 1.5rem 0 .5rem; }
    .row { display: flex; justify-content: space-between; gap: 1rem;
           padding: .55rem 0; border-bottom: 1px solid #21262d; }
    .row span:last-child { font-family: ui-monospace, Menlo, monospace; text-align: right; }
    .pass { color: #3fb950; }
    .fail { color: #f85149; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Container Security Self-Check</h1>

    <h2>Security checks</h2>
    {% for check in checks %}
    <div class="row">
      <span class="{{ 'pass' if check.passed else 'fail' }}">
        {{ '✔' if check.passed else '✘' }} {{ check.name }}
      </span>
      <span>{{ check.value }}</span>
    </div>
    {% endfor %}

    <h2>Build info</h2>
    {% for label, value in info.items() %}
    <div class="row"><span>{{ label }}</span><span>{{ value }}</span></div>
    {% endfor %}
  </main>
</body>
</html>
